<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>メモ</title>
    <style>
      body {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
        font-family: system-ui, sans-serif;
      }
      form {
        display: grid;
        gap: 0.5rem;
      }
      li {
        margin-bottom: 0.5rem;
      }
      .error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <h1>メモ</h1>

    <form id="note-form">
      <input name="title" placeholder="タイトル" />
      <textarea name="body" placeholder="本文" rows="3"></textarea>
      <button type="submit">追加</button>
    </form>
    <p id="error" class="error"></p>

    <ul id="notes"></ul>

    <script type="module">
      const form = document.querySelector('#note-form');
      const errorText = document.querySelector('#error');
      const list = document.querySelector('#notes');

      // 応答が 2xx でなければ、エラーの本文（ErrorBody）の messages を投げる
      async function request(path, options) {
        const res = await fetch(path, options);
        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.messages.join('\n'));
        }
        // 204 No Content には本文が無い
        return res.status === 204 ? null : res.json();
      }

      // 一覧を取ってきて、<ul> を作り直す
      async function showNotes() {
        const notes = await request('/notes');
        list.replaceChildren(
          ...notes.map((note) => {
            const item = document.createElement('li');
            const title = document.createElement('strong');
            title.textContent = note.title;
            const body = document.createElement('div');
            body.textContent = note.body;
            const remove = document.createElement('button');
            remove.textContent = '削除';
            remove.addEventListener('click', async () => {
              await request(`/notes/${note.id}`, { method: 'DELETE' });
              await showNotes();
            });
            item.append(title, ' ', remove, body);
            return item;
          }),
        );
      }

      // フォームを送ったら、メモを作って一覧を出し直す
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorText.textContent = '';
        const data = new FormData(form);
        try {
          await request('/notes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: data.get('title'),
              body: data.get('body'),
            }),
          });
          form.reset();
          await showNotes();
        } catch (error) {
          errorText.textContent = error.message;
        }
      });

      await showNotes();
    </script>
  </body>
</html>
