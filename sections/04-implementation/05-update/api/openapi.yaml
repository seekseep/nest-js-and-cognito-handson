openapi: 3.0.3
info:
  title: メモ API
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /notes:
    get:
      summary: メモの一覧を返す
      responses:
        '200':
          description: メモの一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
    post:
      summary: メモを作る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteInput'
      responses:
        '201':
          description: 作ったメモ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
  /notes/{id}:
    get:
      summary: メモを 1 件返す
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: メモ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: メモを書き換える（送った項目だけ）
      parameters:
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteInput'
      responses:
        '200':
          description: 書き換えたメモ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: メモを消す
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '204':
          description: 消した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    NoteId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Note:
      type: object
      required: [id, title, body, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateNoteInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        body:
          type: string
          maxLength: 1000
          default: ''
    UpdateNoteInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        body:
          type: string
          maxLength: 1000
  responses:
    BadRequest:
      description: 入力が決まりに合わない
    NotFound:
      description: メモが無い
