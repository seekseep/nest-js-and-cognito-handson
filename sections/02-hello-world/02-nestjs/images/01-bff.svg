<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="BFF の役割。ブラウザの画面は BFF だけを呼び出し、BFF がトークンの検証やデータの組み立てを引き受ける">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
<style>text{font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif}.t{font-size:22px;font-weight:700;fill:#0f172a}.s{font-size:15px;fill:#475569}.l{font-size:15px;fill:#1e293b;font-weight:600}</style>
</defs>
<rect width="960" height="320" rx="20" fill="#f8fafc"/>
<rect x="30" y="100" width="230" height="120" rx="16" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="145" y="150" text-anchor="middle" class="t">Next.js の画面</text>
<text x="145" y="180" text-anchor="middle" class="s">ブラウザで動く</text>
<path d="M266 160 L 384 160" stroke="#334155" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="325" y="145" text-anchor="middle" class="l">HTTP</text>
<rect x="390" y="40" width="280" height="240" rx="16" fill="#fdf2f8" stroke="#e0234e" stroke-width="2"/>
<text x="530" y="86" text-anchor="middle" class="t">NestJS（BFF）</text>
<text x="420" y="130" class="s">・トークンを検証する（06 章）</text>
<text x="420" y="160" class="s">・入力をチェックする（04 章）</text>
<text x="420" y="190" class="s">・画面に合わせて組み立てる</text>
<text x="420" y="220" class="s">・エラーとログをそろえる（09 章）</text>
<path d="M676 160 L 794 160" stroke="#334155" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)" stroke-dasharray="6 5"/>
<rect x="800" y="100" width="140" height="120" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="870" y="152" text-anchor="middle" class="l">DB・他の</text>
<text x="870" y="176" text-anchor="middle" class="l">サービス</text>
</svg>
