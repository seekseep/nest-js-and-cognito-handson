<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="認可の決まり。一覧は自分のメモだけ、admin グループの人は全員のメモ。1 件の取得・更新・削除は、持ち主か admin なら許可し、それ以外は 403">
<style>text{font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif}.t{font-size:20px;font-weight:700;fill:#0f172a}.s{font-size:15px;fill:#475569}.l{font-size:16px;fill:#1e293b;font-weight:600}.ok{font-size:16px;fill:#16a34a;font-weight:700}.ng{font-size:16px;fill:#dc2626;font-weight:700}</style>
<rect width="960" height="340" rx="20" fill="#f8fafc"/>
<rect x="30" y="30" width="900" height="280" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="250" y="80" text-anchor="middle" class="t">alice のメモに対して</text>
<text x="520" y="80" text-anchor="middle" class="t">一覧に出る</text>
<text x="770" y="80" text-anchor="middle" class="t">取得・更新・削除</text>
<line x1="50" y1="100" x2="910" y2="100" stroke="#e2e8f0" stroke-width="2"/>
<text x="90" y="150" class="l">alice（持ち主）</text>
<text x="520" y="150" text-anchor="middle" class="ok">出る</text>
<text x="770" y="150" text-anchor="middle" class="ok">できる</text>
<text x="90" y="210" class="l">bob（ほかの人）</text>
<text x="520" y="210" text-anchor="middle" class="ng">出ない</text>
<text x="770" y="210" text-anchor="middle" class="ng">403 Forbidden</text>
<text x="90" y="270" class="l">carol（admin グループ）</text>
<text x="520" y="270" text-anchor="middle" class="ok">出る</text>
<text x="770" y="270" text-anchor="middle" class="ok">できる</text>
</svg>
