<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Cognito の役割。画面はメールアドレスとパスワードを Cognito のユーザープールに送り、トークンを受け取る。トークンを付けて API を呼び、API はトークンを検証する">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
<style>text{font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif}.t{font-size:22px;font-weight:700;fill:#0f172a}.s{font-size:15px;fill:#475569}.l{font-size:15px;fill:#1e293b;font-weight:600}</style>
</defs>
<rect width="960" height="400" rx="20" fill="#f8fafc"/>
<rect x="30" y="130" width="250" height="140" rx="16" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="155" y="190" text-anchor="middle" class="t">メモの画面</text>
<text x="155" y="220" text-anchor="middle" class="s">Next.js + Amplify</text>
<rect x="400" y="20" width="530" height="170" rx="16" fill="#fff1f2" stroke="#dd344c" stroke-width="2"/>
<text x="665" y="60" text-anchor="middle" class="t">Cognito ユーザープール</text>
<rect x="430" y="80" width="220" height="90" rx="12" fill="#fff" stroke="#dd344c" stroke-width="1.5"/>
<text x="540" y="118" text-anchor="middle" class="l">ユーザー</text>
<text x="540" y="144" text-anchor="middle" class="s">メールとパスワード</text>
<rect x="680" y="80" width="220" height="90" rx="12" fill="#fff" stroke="#dd344c" stroke-width="1.5"/>
<text x="790" y="118" text-anchor="middle" class="l">アプリケーション</text>
<text x="790" y="144" text-anchor="middle" class="l">クライアント</text>
<path d="M286 160 L 394 110" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<text x="332" y="116" text-anchor="end" class="s">① サインイン</text>
<path d="M394 150 L 286 195" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<text x="310" y="200" class="s">② トークン</text>
<rect x="400" y="250" width="530" height="120" rx="16" fill="#fdf2f8" stroke="#e0234e" stroke-width="2" stroke-dasharray="6 5"/>
<text x="665" y="300" text-anchor="middle" class="t">API（NestJS）</text>
<text x="665" y="332" text-anchor="middle" class="s">トークンを検証してから応答する（06 章）</text>
<path d="M286 240 L 394 300" stroke="#334155" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="6 5"/>
<text x="155" y="305" text-anchor="middle" class="s">③ トークンを付けて呼ぶ</text>
</svg>
