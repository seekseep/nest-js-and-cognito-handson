services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      - "3000:3000"
    # .env.local の値を、コンテナの環境変数として渡す。
    # .env.local はイメージには入れない（.containerignore で除いている）。
    env_file:
      - path: ./frontend/.env.local
        required: false
    develop:
      watch:
        # app/ と public/ の変更を、コンテナの中へコピーする
        - action: sync
          path: ./frontend/app
          target: /app/app
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync
          path: ./frontend/lib
          target: /app/lib
        # 依存を変えたら、イメージを作り直す
        - action: rebuild
          path: ./frontend/package.json

  bff:
    build:
      context: ./bff
      dockerfile: Containerfile
    ports:
      - "3001:3001"
    develop:
      watch:
        # src/ の変更をコンテナの中へコピーする。nest start --watch が拾って再起動する
        - action: sync
          path: ./bff/src
          target: /app/src
        - action: rebuild
          path: ./bff/package.json
