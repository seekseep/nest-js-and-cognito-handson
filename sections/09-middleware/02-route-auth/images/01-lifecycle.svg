<style>text{font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif}.t{font-size:17px;font-weight:700;fill:#0f172a}.s{font-size:13px;fill:#475569}</style>
</defs>
<rect width="960" height="330" rx="20" fill="#f8fafc"/>
<rect x="20" y="50" width="150" height="110" rx="14" fill="#fff" stroke="#475569" stroke-width="2"/>
