<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="NestJS がリクエストを処理する順番。middleware、Guard、Pipe、コントローラーの順に進み、どこかで例外が起きると ExceptionFilter が応答を作る">
<defs>
