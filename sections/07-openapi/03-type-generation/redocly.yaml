# Redocly（CLI と VS Code 拡張機能）が openapi.yaml を確かめるときの決まり
extends:
  - recommended

rules:
  # 公開しない API なので、ライセンスは書かない
  info-license: off
  # 手元で動かす API なので、servers の localhost を許す
  no-server-example.com: off

# openapi-typescript で型を作るときの出力先（npm run generate:api）
apis:
  ui:
    root: ./openapi.yaml
    x-openapi-ts:
      output: ./ui/lib/api/schema.d.ts
  api:
    root: ./openapi.yaml
    x-openapi-ts:
      output: ./api/src/api/schema.d.ts
