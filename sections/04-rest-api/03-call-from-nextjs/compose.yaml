services:
  ui:
    build:
      context: ./ui
      dockerfile: Containerfile
    ports:
      - "3000:3000"
    develop:
      watch:
        # app/ と public/ の変更を、コンテナの中へコピーする
        - action: sync
          path: ./ui/app
          target: /app/app
        - action: sync
          path: ./ui/public
          target: /app/public
        - action: sync
          path: ./ui/lib
          target: /app/lib
        # 依存を変えたら、イメージを作り直す
        - action: rebuild
          path: ./ui/package.json

  api:
    build:
      context: ./api
      dockerfile: Containerfile
    ports:
      - "3001:3001"
    develop:
      watch:
        # src/ の変更をコンテナの中へコピーする。nest start --watch が拾って再起動する
        - action: sync
          path: ./api/src
          target: /app/src
        - action: rebuild
          path: ./api/package.json
