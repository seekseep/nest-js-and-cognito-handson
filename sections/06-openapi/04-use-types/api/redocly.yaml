# Redocly（CLI と VS Code 拡張機能）が openapi.yaml を確かめるときの決まり
extends:
  - recommended

rules:
  # 公開しない API なので、ライセンスは書かない
  info-license: off
  # 手元で動かす API なので、servers の localhost を許す
  no-server-example.com: off
  # 認証を付けない API なので、security は書かない
  security-defined: off
  # 一覧（GET /notes）のように、4xx を返さない操作もある
  operation-4xx-response: off
