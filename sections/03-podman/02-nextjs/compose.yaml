services:
  ui:
    build:
      context: ./ui
      dockerfile: Containerfile
    ports:
      - "3000:3000"
    develop:
      watch:
        # app/ と public/ の変更を、コンテナの中へコピーする
        - action: sync
          path: ./ui/app
          target: /app/app
        - action: sync
          path: ./ui/public
          target: /app/public
        # 依存を変えたら、イメージを作り直す
        - action: rebuild
          path: ./ui/package.json
