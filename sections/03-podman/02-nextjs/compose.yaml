services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      - "3000:3000"
    develop:
      watch:
        # app/ と public/ の変更を、コンテナの中へコピーする
        - action: sync
          path: ./frontend/app
          target: /app/app
        - action: sync
          path: ./frontend/public
          target: /app/public
        # 依存を変えたら、イメージを作り直す
        - action: rebuild
          path: ./frontend/package.json
