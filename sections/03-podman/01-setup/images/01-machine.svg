<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="macOS では Podman マシンという Linux の仮想マシンの中でコンテナが動く。podman コマンドは Mac から仮想マシンに指示を送る">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
<style>text{font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif}.t{font-size:22px;font-weight:700;fill:#0f172a}.s{font-size:15px;fill:#475569}.l{font-size:15px;fill:#1e293b;font-weight:600}</style>
</defs>
<rect width="960" height="360" rx="20" fill="#f8fafc"/>
<rect x="20" y="20" width="920" height="320" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="44" y="56" class="t">Mac</text>
<rect x="50" y="110" width="250" height="150" rx="16" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="175" y="160" text-anchor="middle" class="t">ターミナル</text>
<text x="175" y="192" text-anchor="middle" class="s">podman run …</text>
<text x="175" y="218" text-anchor="middle" class="s">podman compose up …</text>
<path d="M306 185 L 424 185" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<text x="365" y="170" text-anchor="middle" class="l">指示</text>
<rect x="430" y="70" width="480" height="240" rx="16" fill="#faf5ff" stroke="#892ca0" stroke-width="2"/>
<text x="670" y="110" text-anchor="middle" class="t">Podman マシン（Linux の仮想マシン）</text>
<rect x="460" y="140" width="200" height="130" rx="14" fill="#fff" stroke="#892ca0" stroke-width="2"/>
<text x="560" y="196" text-anchor="middle" class="l">コンテナ</text>
<text x="560" y="222" text-anchor="middle" class="s">frontend（3000）</text>
<rect x="680" y="140" width="200" height="130" rx="14" fill="#fff" stroke="#892ca0" stroke-width="2"/>
<text x="780" y="196" text-anchor="middle" class="l">コンテナ</text>
<text x="780" y="222" text-anchor="middle" class="s">bff（3001）</text>
</svg>
