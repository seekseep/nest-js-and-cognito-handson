<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="3 種類のテストが確かめる範囲。単体テストは 1 つのクラスだけ、結合テストは BFF 全体を HTTP で、E2E テストはブラウザから画面と BFF をまとめて確かめる">
<defs>
<style>text{font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif}.t{font-size:20px;font-weight:700;fill:#0f172a}.s{font-size:14px;fill:#475569}.l{font-size:15px;fill:#1e293b;font-weight:600}.m{font-size:13px;fill:#1e293b;font-family:ui-monospace,Menlo,monospace}</style>
</defs>
<rect width="960" height="470" rx="20" fill="#f8fafc"/>
<!-- 部品 -->
<rect x="40" y="40" width="150" height="70" rx="12" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="115" y="72" text-anchor="middle" class="l">ブラウザ</text>
<text x="115" y="94" text-anchor="middle" class="s">メモの画面</text>
<rect x="240" y="40" width="680" height="70" rx="12" fill="#fff" stroke="#E0234E" stroke-width="2"/>
<text x="270" y="80" class="l">BFF</text>
<rect x="320" y="55" width="110" height="40" rx="8" fill="#fde2e8"/>
<text x="375" y="80" text-anchor="middle" class="m">middleware</text>
<rect x="445" y="55" width="90" height="40" rx="8" fill="#fde2e8"/>
<text x="490" y="80" text-anchor="middle" class="m">Guard</text>
<rect x="550" y="55" width="120" height="40" rx="8" fill="#fde2e8"/>
<text x="610" y="80" text-anchor="middle" class="m">Controller</text>
<rect x="685" y="55" width="110" height="40" rx="8" fill="#fde2e8"/>
<text x="740" y="80" text-anchor="middle" class="m">Service</text>
<rect x="810" y="55" width="95" height="40" rx="8" fill="#e2e8f0"/>
<text x="857" y="80" text-anchor="middle" class="m">Verifier</text>
<!-- 単体 -->
<rect x="320" y="140" width="110" height="20" rx="6" fill="#16a34a"/>
<rect x="685" y="140" width="110" height="20" rx="6" fill="#16a34a"/>
<rect x="445" y="140" width="90" height="20" rx="6" fill="#16a34a"/>
<text x="40" y="156" class="t">単体テスト</text>
<text x="40" y="182" class="s">1 つのクラス・関数だけ。ほかは偽物（モック）にする</text>
<text x="640" y="182" class="m">Vitest ・ 10-01</text>
<!-- 結合 -->
<rect x="320" y="230" width="475" height="20" rx="6" fill="#2563eb"/>
<rect x="810" y="230" width="95" height="20" rx="6" fill="#94a3b8"/>
<text x="40" y="246" class="t">結合テスト</text>
<text x="40" y="272" class="s">BFF 全体を HTTP で呼ぶ。トークンの検証だけ偽物にする</text>
<text x="640" y="272" class="m">Vitest + supertest ・ 10-02</text>
<!-- E2E -->
<text x="40" y="336" class="t">E2E テスト</text>
<text x="40" y="362" class="s">ブラウザで画面を操作し、画面から BFF までまとめて確かめる</text>
<text x="640" y="362" class="m">Playwright ・ 10-03</text>
<rect x="40" y="385" width="755" height="20" rx="6" fill="#9333ea"/>
<rect x="810" y="385" width="95" height="20" rx="6" fill="#94a3b8"/>
<text x="905" y="445" text-anchor="end" class="s">灰色 = 偽物（決め打ちのトークンを通す）</text>
</svg>
